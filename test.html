<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OTA Map</title>
    <link rel="icon" type="image/png" href="./assets/img/favicon.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="./js/app.js" defer></script>
    <link rel="stylesheet" href="./assets/CSS/test.css" />
  </head>
  <body>
    <header class="topbar">
      <h1 class="title">Carte OTA</h1>
        <div class="mb-3">
          <label for="department" class="form-label fw-bold">Département</label>
          <select id="department" class="form-select select-btn">
            <option value="75">75 - Paris</option>
          </select>
        </div>
        <div class="mb-3 types-dropdown">
            <label class="form-label fw-bold">Types</label>

            <div class="dropdown">
              <button class="btn btn-secondary dropdown-toggle w-100 text-start" type="button" id="typesDropdownBtn" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
                Sélectionner les types
              </button>
              <div class="dropdown-menu p-3" aria-labelledby="typesDropdownBtn">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="lighthouse" id="typeLighthouse" checked>
                  <label class="form-check-label" for="typeLighthouse">Phare</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="beach" id="typeBeach" checked>
                  <label class="form-check-label" for="typeBeach">Plage</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="military_bunker" id="typeMil" checked>
                  <label class="form-check-label" for="typeMil">Military Bunker</label>
                </div>

                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="civil_bunker" id="typeCiv" checked>
                  <label class="form-check-label" for="typeCiv">Civil Bunker</label>
                </div>
              </div>
            </div>
          </div>
                    <div class="mb-3">
            <label for="activation" class="form-label fw-bold">Activation</label>
            <select id="activation" class="form-select">
              <option value="all">Tous</option>
              <option value="activated">Actives</option>
              <option value="not-activated">Pas encore actives</option>
            </select>
          </div>

          <div class="d-grid gap-2 mb-3">
            <button id="loadBtn" class="btn btn-primary">Charger les points OSM</button>
          </div>
          <p id="status" class="alert alert-secondary py-2 mb-0">Prêt.</p>
        <button id="locateBtnHeader" class="btn btn-primary">Me localiser</button>
    </header>
    <main>
      <section id="map"></section>
    </main>

<footer class="bottombar">
  <div class="legend">
    <p class="legend-item name">Légende :</p>
    <span class="legend-item">
      <span class="dot red"></span> Phare
    </span>

    <span class="legend-item">
      <span class="dot green"></span> Bunker militaire
    </span>

    <span class="legend-item">
      <span class="dot cyan"></span> Bunker civil
    </span>

    <span class="legend-item">
      <span class="dot yellow"></span> Plage
    </span>

  </div>
</footer>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
